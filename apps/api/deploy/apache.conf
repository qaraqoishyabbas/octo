<VirtualHost *:10000>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>
    # Public media bypasses Laravel, so its CORS middleware cannot add these headers.
    <LocationMatch "^/storage/">
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, HEAD, OPTIONS"
        Header always set Access-Control-Expose-Headers "Content-Length, Content-Range"
    </LocationMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
    LimitRequestBody 1153433600
</VirtualHost>
